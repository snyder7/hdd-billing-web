<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Silicon Traders Inventory</title>
<style>
:root{--ink:#172b4d;--muted:#607080;--bg:#f5f7fa;--card:#fff;--blue:#1565c0;--green:#2e7d32;--red:#c62828;--line:#dfe5ec}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}
h3{margin:0 0 6px}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:99px;background:#e3f2e5;color:var(--green);white-space:nowrap}
.pill.off{background:#fdecea;color:var(--red)}
.pill.sync{background:#fff4e0;color:#b26a00}
.summary{background:#e3ecf7;border-radius:12px;padding:12px;line-height:1.55;font-size:14px;margin-bottom:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.btn{border:0;border-radius:9px;padding:9px 12px;font-size:14px;background:#e8eef6;color:var(--ink);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:#fdecea;color:var(--red)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.grow{flex:1}
.chip{opacity:.55}.chip.on{opacity:1;background:var(--blue);color:#fff}
.tabs{display:flex;gap:4px;margin:6px 0 10px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
.inline{display:flex;gap:6px}.inline .btn{flex:none}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card .head{display:flex;gap:10px}
.card img.th{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:#eee}
.card .t{font-weight:700;font-size:16px}
.st-in{color:var(--green);font-weight:700;font-size:13px}.st-sold{color:var(--red);font-weight:700;font-size:13px}
.card .d{color:#455a64;font-size:13px;line-height:1.5;margin:6px 0 8px;word-break:break-word}
.card .acts{display:flex;gap:6px}.card .acts .btn{flex:1;padding:8px 4px;font-size:12.5px}
.badge{display:inline-block;font-size:11px;background:#eef2f7;border-radius:6px;padding:1px 6px;margin-left:4px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.overlay.top{z-index:60}.overlay.top2{z-index:70}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:16px}}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.th2{position:relative;width:76px;height:76px}
.th2 img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.th2 button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:13px;line-height:1;padding:0}
.line{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;position:relative}
.line .ld{padding-right:34px;font-size:14px}
.line .lq{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:13px;flex-wrap:wrap}
.line .lq input{width:78px;padding:7px}
.line .rm{position:absolute;top:6px;right:6px;padding:4px 9px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
.pick input{width:20px;height:20px;margin-top:2px;flex:none}
.total{font-size:18px;font-weight:700;text-align:right;margin:8px 0}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 70px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#263238;color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90%;text-align:center}
#toast.show{opacity:1}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:380px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 3px 10px rgba(0,0,0,.25);border-radius:99px;padding:13px 18px;font-size:15px;z-index:20}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="box" id="loginForm">
    <h1>Silicon Traders Inventory</h1>
    <div class="sub">Sirf authorized login. Dono bhai ek hi data dekhenge.</div>
    <label>Email</label><input id="l_email" type="email" autocomplete="username" required>
    <label>Password</label><input id="l_pass" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" style="width:100%;margin-top:8px" id="loginBtn">Login</button>
    <div class="foot" style="margin:14px 0 0">Powered by Silicon Traders</div>
  </form>
</div>

<div id="app" class="hidden">
  <div class="wrap">
    <div class="top"><h1>Silicon Traders Inventory</h1><span class="pill" id="sync">...</span></div>
    <div class="sub" id="who"></div>
    <div class="row">
      <button class="btn sm" data-act="shop">⚙ Shop</button>
      <button class="btn sm" data-act="backup">⬇ Backup</button>
      <button class="btn sm" data-act="restore">⬆ Restore</button>
      <button class="btn sm" data-act="logout">Logout</button>
    </div>
    <div class="tabs" id="tabs">
      <button data-act="tab" data-v="stock">📦 Stock</button>
      <button data-act="tab" data-v="bills">🧾 Bills</button>
      <button data-act="tab" data-v="ew">♻ E-waste</button>
    </div>

    <section id="tab_stock">
      <button class="btn primary" style="width:100%;margin-bottom:8px" data-act="share">🔗 Public Stock List / WhatsApp par bhejo</button>
      <div class="summary" id="summary"></div>
      <div class="row" id="filters"></div>
      <div class="inline" style="margin-bottom:10px"><input id="q" placeholder="Search serial / model / capacity / buyer / invoice"><button class="btn" data-act="scansearch" title="Barcode scan">📷</button></div>
      <div id="list"></div>
    </section>

    <section id="tab_bills" class="hidden">
      <div class="summary" id="billSummary"></div>
      <div id="billList"></div>
    </section>

    <section id="tab_ew" class="hidden">
      <div class="summary" id="ewSummary"></div>
      <div class="row">
        <button class="btn sm grow" data-act="ewbill">🧾 Scrap bill banao</button>
        <button class="btn sm grow" data-act="seedcats">+ Common categories</button>
      </div>
      <div id="ewList"></div>
    </section>

    <div class="foot">Powered by Silicon Traders • v3</div>
  </div>
  <button class="btn primary fab" id="fab" data-act="fab">+ Add Drive</button>
  <input type="file" id="restoreFile" accept=".json,application/json" class="hidden">
</div>

<div id="modal"></div>
<div id="sub"></div>
<div id="scanner"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot, runTransaction, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCtthl5l3xK2V5ptFXAjxhrO-hTFws6O78",
  authDomain: "hdd-billing-manager.firebaseapp.com",
  projectId: "hdd-billing-manager",
  storageBucket: "hdd-billing-manager.firebasestorage.app",
  messagingSenderId: "14875151294",
  appId: "1:14875151294:web:70db0a4e0d0e9f8349c7ef"
};

const KINDS = ["HDD", "SSD", "NVMe SSD", "External HDD", "Other"];
const CONDITIONS = ["New", "Excellent", "Good", "Average", "Faulty / For parts"];
const PAYMENTS = ["Cash", "UPI", "Card", "Bank transfer", "Credit / Due"];
const FILTERS = ["All", "In Stock", "Sold"];
const COMMON_CATS = ["RAM", "Processor", "TV kit / TV board", "Motherboard", "SMPS / PSU", "Mobile board", "Hard disk scrap", "Cable / wire", "Battery", "Other scrap"];
const MAX_PHOTOS = 5, PHOTO_MAX = 150000;
const ZX_URL = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
const TESS_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => parseFloat(v) || 0;
const m0 = n => Math.round(n).toLocaleString("en-IN");
const m2 = n => (Math.round(n * 100) / 100).toFixed(2);
const fq = n => String(Math.round(n * 1000) / 1000);
const today = () => { const d = new Date(); return String(d.getDate()).padStart(2, "0") + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + d.getFullYear(); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const opts = (list, sel) => list.map(o => `<option${o === sel ? " selected" : ""}>${esc(o)}</option>`).join("");
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 4000); }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
const loaded = {};
function loadScript(url) {
  if (loaded[url]) return loaded[url];
  return loaded[url] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = url; s.onload = res; s.onerror = () => { delete loaded[url]; rej(new Error("load failed")); }; document.head.appendChild(s); });
}

let app, auth, db;
let user = null, items = [], bills = [], ewaste = [], filter = "All", query = "", tab = "stock";
let editPhotos = [], editing = null, draft = null, restoreData = null;
let shop = { name: "", address: "", phone: "", gstin: "", gstPercent: "", prefix: "INV-", nextNo: 1 };
let unsubs = [], pendingWrites = false;
let publicMap = new Map(), publicMeta = null, publicServer = false, driveServer = false, metaLoaded = false, shopLoaded = false, ruleWarned = false, syncTimer = null, syncing = false, syncAgain = false;

function blankItem() {
  return { id: newId(), createdAt: Date.now(), kind: "HDD", brandModel: "", capacity: "", serial: "", health: "", hours: "", condition: "Good", warranty: "", buyPrice: "", sellPrice: "", status: "In Stock", photo: "", photos: [], buyer: "", notes: "", buyerPhone: "", payment: "Cash", soldDate: "", invoiceNo: "", showPublic: "1" };
}
function normalize(o) {
  const b = blankItem(), r = { ...b };
  for (const k of Object.keys(b)) {
    if (k === "photos" || o[k] === undefined || o[k] === null) continue;
    r[k] = k === "createdAt" ? (Number(o[k]) || b.createdAt) : String(o[k]);
  }
  r.id = String(o.id || b.id);
  const ph = Array.isArray(o.photos) ? o.photos : (o.photo ? [o.photo] : []);
  r.photos = ph.filter(p => typeof p === "string" && p.startsWith("data:image")).slice(0, MAX_PHOTOS);
  r.photo = r.photos[0] || "";
  if (!o.createdAt && Number(o.id)) r.createdAt = Number(o.id);
  return r;
}
function normBill(o) {
  return { id: String(o.id || newId()), createdAt: Number(o.createdAt) || Date.now(), invoiceNo: String(o.invoiceNo || ""), date: String(o.date || today()),
    buyer: String(o.buyer || ""), buyerPhone: String(o.buyerPhone || ""), payment: String(o.payment || "Cash"), notes: String(o.notes || ""),
    showPhotos: o.showPhotos !== false, total: Number(o.total) || 0,
    lines: (Array.isArray(o.lines) ? o.lines : []).map(l => ({ t: l.t || "custom", driveId: l.driveId || "", catId: l.catId || "", desc: String(l.desc || ""), spec: String(l.spec || ""),
      serial: String(l.serial || ""), unit: String(l.unit || "pc"), qty: Number(l.qty) || 0, rate: Number(l.rate) || 0 })) };
}
const normEw = o => ({ id: String(o.id || newId()), name: String(o.name || ""), unit: o.unit === "kg" ? "kg" : "pc", rate: Number(o.rate) || 0, updatedAt: Number(o.updatedAt) || Date.now() });
const billTotal = lines => Math.round(lines.reduce((a, l) => a + (+l.qty || 0) * (+l.rate || 0), 0) * 100) / 100;
const billOfDrive = id => bills.find(b => b.lines.some(l => l.driveId === id));

// ---------- init ----------
try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) { document.body.innerHTML = "<p style='padding:20px'>Firebase config error: " + esc(e.message) + "</p>"; }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});

function welcomeName(u) {
  if (u.displayName) return u.displayName;
  const raw = (u.email || "").split("@")[0];
  let n = raw.replace(/[-_.]?hdd$/i, "") || raw;
  n = n.split(/[-_.0-9]/)[0] || n;
  return n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
}
function authMsg(code) {
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email"].includes(code)) return "Email ya password galat hai.";
  if (code === "auth/network-request-failed") return "Internet nahi hai. Pehli baar login ke liye internet chahiye.";
  if (code === "auth/too-many-requests") return "Bahut baar galat try kiya. Thodi der baad try karo.";
  return "Login nahi hua: " + code;
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("#loginErr").textContent = ""; $("#loginBtn").disabled = true;
  try { await signInWithEmailAndPassword(auth, $("#l_email").value.trim(), $("#l_pass").value); }
  catch (err) { $("#loginErr").textContent = authMsg(err.code); }
  $("#loginBtn").disabled = false;
});
onAuthStateChanged(auth, u => {
  user = u;
  if (u) { $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); $("#who").textContent = "Welcome " + welcomeName(u); startListeners(); }
  else { stopListeners(); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
});
function startListeners() {
  stopListeners();
  const watch = (name, fn) => unsubs.push(onSnapshot(collection(db, name), snap => { fn(snap.docs.map(d => d.data()), snap); pendingWrites = snap.metadata.hasPendingWrites; render(); updateSync(); }, err => toast("Sync error: " + err.code)));
  watch("drives", (a, snap) => { items = a.map(normalize); if (!snap.metadata.fromCache) driveServer = true; scheduleSync(); });
  watch("bills", a => { bills = a.map(normBill); });
  watch("ewaste", a => { ewaste = a.map(normEw).sort((x, y) => x.name.localeCompare(y.name)); });
  unsubs.push(onSnapshot(doc(db, "settings", "shop"), s => { if (s.exists()) shop = { ...shop, ...s.data() }; if (!s.metadata.fromCache) shopLoaded = true; scheduleSync(); }));
  unsubs.push(onSnapshot(collection(db, "public_stock"), snap => { publicMap = new Map(snap.docs.map(d => [d.id, d.data()])); if (!snap.metadata.fromCache) publicServer = true; scheduleSync(); },
    () => { if (!ruleWarned) { ruleWarned = true; toast("Public list ke liye Firebase rules update karo (UPDATE.md dekho)."); } }));
  unsubs.push(onSnapshot(doc(db, "public_meta", "shop"), s => { publicMeta = s.exists() ? s.data() : null; if (!s.metadata.fromCache) metaLoaded = true; scheduleSync(); }, () => {}));
  updateSync();
}
function stopListeners() {
  unsubs.forEach(u => u()); unsubs = []; items = []; bills = []; ewaste = []; publicMap = new Map(); publicMeta = null;
  publicServer = driveServer = metaLoaded = shopLoaded = false; render();
}
function updateSync() {
  const p = $("#sync");
  if (!navigator.onLine) { p.textContent = "Offline"; p.className = "pill off"; }
  else if (pendingWrites) { p.textContent = "Syncing…"; p.className = "pill sync"; }
  else { p.textContent = "Synced ✓"; p.className = "pill"; }
}
addEventListener("online", updateSync); addEventListener("offline", updateSync);

// ---------- render ----------
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === tab));
  $("#tab_stock").classList.toggle("hidden", tab !== "stock");
  $("#tab_bills").classList.toggle("hidden", tab !== "bills");
  $("#tab_ew").classList.toggle("hidden", tab !== "ew");
  $("#fab").textContent = tab === "stock" ? "+ Add Drive" : tab === "bills" ? "+ New Bill" : "+ Category";
  if (tab === "stock") renderStock(); else if (tab === "bills") renderBills(); else renderEw();
}
function renderStock() {
  $("#filters").innerHTML = FILTERS.map(f => `<button class="btn sm grow chip${f === filter ? " on" : ""}" data-act="filter" data-v="${f}">${f}</button>`).join("");
  const inStock = items.filter(i => i.status === "In Stock"), sold = items.filter(i => i.status === "Sold");
  const stockCost = inStock.reduce((a, i) => a + num(i.buyPrice), 0);
  const dRev = sold.reduce((a, i) => a + num(i.sellPrice), 0);
  const eRev = bills.reduce((a, b) => a + b.lines.filter(l => l.t !== "drive").reduce((x, l) => x + l.qty * l.rate, 0), 0);
  const profit = dRev - sold.reduce((a, i) => a + num(i.buyPrice), 0);
  $("#summary").innerHTML = `Total: <b>${items.length}</b> &nbsp; In stock: <b>${inStock.length}</b> &nbsp; Sold: <b>${sold.length}</b><br>Stock value (cost): <b>₹${m0(stockCost)}</b><br>Drive sales: <b>₹${m0(dRev)}</b> &nbsp; Profit: <b>₹${m0(profit)}</b><br>E-waste / other sales: <b>₹${m0(eRev)}</b>`;
  const q = query.trim().toLowerCase();
  const list = items.filter(i => (filter === "All" || i.status === filter) &&
    (!q || [i.serial, i.brandModel, i.capacity, i.kind, i.status, i.buyer, i.invoiceNo].some(s => String(s).toLowerCase().includes(q)))).sort((a, b) => b.createdAt - a.createdAt);
  $("#list").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">${items.length ? "Koi drive nahi mila." : "Abhi koi drive nahi hai. + Add Drive dabao."}</div>`;
}
function card(i) {
  const sold = i.status === "Sold", pub = !sold && i.showPublic !== "0";
  return `<div class="card">
    <div class="head">${i.photo ? `<img class="th" loading="lazy" src="${i.photo}" alt="">` : ""}
      <div><div class="t">${esc(i.kind)} • ${esc(i.brandModel || "Unnamed")} • ${esc(i.capacity)}</div>
      <div class="${sold ? "st-sold" : "st-in"}">${esc(i.status)}${sold && i.soldDate ? " • " + esc(i.soldDate) : ""}${i.photos.length > 1 ? `<span class="badge">📷 ${i.photos.length}</span>` : ""}${sold ? "" : `<span class="badge">${pub ? "🌐 Public" : "🔒 Hidden"}</span>`}</div></div></div>
    <div class="d">Serial: ${esc(i.serial || "Not entered")}<br>${esc(i.condition)}${i.warranty ? " • Warranty: " + esc(i.warranty) : ""}<br>
      Selling price: <b style="font-size:16px;color:var(--green)">${num(i.sellPrice) ? "₹" + m0(num(i.sellPrice)) : "—"}</b>
      ${sold ? `<br>Buyer: ${esc(i.buyer || "—")}${i.invoiceNo ? " | " + esc(i.invoiceNo) : ""}` : ""}</div>
    <div class="acts">
      <button class="btn" data-act="edit" data-id="${i.id}">Edit</button>
      ${sold ? `<button class="btn" data-act="invoice" data-id="${i.id}">Invoice</button><button class="btn" data-act="stock" data-id="${i.id}">Mark Stock</button>`
             : `<button class="btn primary" data-act="sell" data-id="${i.id}">Sell / Bill</button>`}
      <button class="btn danger" data-act="del" data-id="${i.id}">Delete</button>
    </div></div>`;
}
function renderBills() {
  const tot = bills.reduce((a, b) => a + b.total, 0);
  $("#billSummary").innerHTML = `Total bills: <b>${bills.length}</b> &nbsp; Total sale: <b>₹${m0(tot)}</b>`;
  const list = [...bills].sort((a, b) => b.createdAt - a.createdAt);
  $("#billList").innerHTML = list.length ? list.map(b => {
    const nd = b.lines.filter(l => l.t === "drive").length, ne = b.lines.length - nd;
    return `<div class="card"><div class="t">${esc(b.invoiceNo || "(number pending)")} • ₹${m0(b.total)}</div>

async function toBitmap(file) {
  try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
}
async function compressBitmap(bmp) {
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  let max = 640, out = "";
  for (let t = 0; t < 4; t++) {
    const s = Math.min(1, max / Math.max(w0, h0)), c = document.createElement("canvas");
    c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    let q = 0.6; out = c.toDataURL("image/jpeg", q);
    while (out.length > PHOTO_MAX && q > 0.32) { q -= 0.08; out = c.toDataURL("image/jpeg", q); }
    if (out.length <= PHOTO_MAX) break;
    max = Math.round(max * 0.8);
  }
  return out;
}
async function detectBarcodes(bmp) {
  if ("BarcodeDetector" in window) { try { const r = await new BarcodeDetector().detect(bmp); if (r.length) return r.map(x => x.rawValue); } catch {} }
  try {
    await loadScript(ZX_URL);
    const c = document.createElement("canvas"); c.width = bmp.width || bmp.naturalWidth; c.height = bmp.height || bmp.naturalHeight;
    c.getContext("2d").drawImage(bmp, 0, 0);
    const res = await new window.ZXing.BrowserMultiFormatReader().decodeFromImageUrl(c.toDataURL("image/jpeg", 0.92));
    return [res.getText()];
  } catch { return []; }
}
function scanBarcode() {
  return new Promise(async resolve => {
    let stream = null, stopped = false;
    const stop = v => { stopped = true; if (stream) stream.getTracks().forEach(t => t.stop()); $("#scanner").innerHTML = ""; resolve(v); };
    $("#scanner").innerHTML = `<div class="overlay top2"><div class="sheet"><h3>Barcode scan karo</h3>
      <video id="scanVideo" playsinline muted autoplay style="width:100%;border-radius:10px;background:#000;max-height:50vh"></video>
      <div class="sub">Barcode ko camera ke saamne seedha rakho.</div><button class="btn grow" style="width:100%" id="scanCancel">Cancel</button></div></div>`;
    $("#scanCancel").onclick = () => stop(null);
    const video = $("#scanVideo");
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false }); video.srcObject = stream; await video.play(); }
    catch { toast("Camera permission nahi mili"); stop(null); return; }
    if ("BarcodeDetector" in window) {
      const det = new BarcodeDetector();
      const loop = async () => { if (stopped) return; try { const r = await det.detect(video); if (r.length) { stop(r[0].rawValue); return; } } catch {} setTimeout(loop, 200); };
      loop();
    } else {
      try { await loadScript(ZX_URL); } catch { toast("Scanner load nahi hua (internet chahiye)"); stop(null); return; }
      const reader = new window.ZXing.BrowserMultiFormatReader(), c = document.createElement("canvas");
      const loop = async () => {
        if (stopped) return;
        try { c.width = video.videoWidth; c.height = video.videoHeight; c.getContext("2d").drawImage(video, 0, 0); const r = await reader.decodeFromImageUrl(c.toDataURL("image/jpeg", 0.85)); stop(r.getText()); return; } catch {}
        setTimeout(loop, 350);

      loop();
    }
  });
}
function ocrCanvas(bmp) {
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight, s = Math.min(2, 1800 / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  const ctx = c.getContext("2d"); ctx.filter = "grayscale(1) contrast(1.3)"; ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}
async function runOCR(bmp, progress) {
  await loadScript(TESS_URL);
  const worker = await window.Tesseract.createWorker("eng", 1, { logger: m => { if (m.status === "recognizing text") progress(Math.round(m.progress * 100)); } });
  try { const r = await worker.recognize(ocrCanvas(bmp)); return r.data.text; } finally { await worker.terminate(); }

const STD_GB = [16, 32, 40, 60, 64, 80, 120, 128, 160, 200, 240, 250, 256, 320, 400, 480, 500, 512, 640, 750, 960, 1000, 2000, 3000, 4000, 5000, 6000, 8000, 10000];
function normCap(val, unit) {
  let gb = parseFloat(String(val).replace(",", ".")); if (!gb) return "";
  if (/^t/i.test(unit)) gb *= 1000;
  let best = 0, bd = 9;
  for (const s of STD_GB) { const d = Math.min(Math.abs(Math.log(gb / s)), Math.abs(Math.log(gb / 0.931 / s))); if (d < bd) { bd = d; best = s; } }
  if (bd > 0.1) return "";

}
const BRANDS = [[/seagate|\bST\d{3,5}[A-Z]{2}\d{3}/i, "Seagate"], [/western\s*digital|\bWDC?\b|\bWD\d{3,5}[A-Z]{3,4}/i, "WD"], [/toshiba|\bMQ0\d|\bMK\d{4}/i, "Toshiba"],
  [/samsung/i, "Samsung"], [/hgst|hitachi/i, "HGST"], [/crucial/i, "Crucial"], [/kingston/i, "Kingston"], [/sandisk/i, "SanDisk"], [/intel/i, "Intel"],
  [/transcend/i, "Transcend"], [/adata/i, "ADATA"], [/lexar/i, "Lexar"], [/micron/i, "Micron"], [/fujitsu/i, "Fujitsu"], [/maxtor/i, "Maxtor"], [/\bHTS\d{6}/i, "HGST"]];
function parseLabel(raw) {
  const t = String(raw || "").replace(/\r/g, ""), out = {};
  let m = t.match(/health[^\n\d]{0,25}(\d{1,3})\s*%/i); if (m && +m[1] <= 100) out.health = m[1];
  m = t.match(/power\s*on\s*time[^\d\n]{0,15}(\d+)\s*days?[^\d\n]{0,6}(\d+)?\s*hours?/i);
  if (m) out.hours = String(+m[1] * 24 + (+m[2] || 0));
  else { m = t.match(/power\s*on\s*hours?[^\d\n]{0,25}(\d[\d,]*)/i); if (m) out.hours = m[1].replace(/,/g, ""); }
  const sn = [...t.matchAll(/(?:serial\s*(?:number|no\.?|#)?|s\/?n|\bsn)\s*[:#.\-]?\s*([A-Z0-9][A-Z0-9\-]{5,23})/gi)].map(x => x[1]).find(x => /\d/.test(x));
  if (sn) out.serial = sn.toUpperCase();
  m = t.match(/(?:model\s*(?:number|no\.?|name)?|m\/n)\s*[:#.\-]?\s*([A-Z0-9][A-Za-z0-9\-\/. ]{3,34})/i);
  let model = m ? m[1].split(/\s{2,}|\n/)[0].trim() : "";
  if (!model) { const k = t.match(/\b(ST\d{3,5}[A-Z]{2}\d{3}|WD\d{3,5}[A-Z]{3,4}(?:-[A-Z0-9]+)?|MQ\d{2}[A-Z]{3}\d{3}|HTS\d{6}[A-Z0-9]*|MZ[A-Z0-9\-]{6,12})\b/); if (k) model = k[1]; }
  let brand = "", brandRe = null; for (const [re, name] of BRANDS) if (re.test(t + " " + model)) { brand = name; brandRe = re; break; }
  if (!model && brandRe) { const ln = t.split("\n").find(l => brandRe.test(l)); if (ln) model = ln.replace(/\d+(?:[.,]\d+)?\s*(?:GB|TB)/gi, "").replace(/\s+/g, " ").trim().slice(0, 40); }
  if (model || brand) out.model = ((brand && !model.toLowerCase().startsWith(brand.toLowerCase()) ? brand + " " : "") + model).trim();
  for (const c of t.matchAll(/(\d{1,5}(?:[.,]\d{1,3})?)\s*(GB|TB)\b/gi)) { const cap = normCap(c[1], c[2]); if (cap) { out.capacity = cap; break; } }

  else if (/external|portable|passport|expansion|elements/i.test(t)) out.kind = "External HDD";
  else if (/\bssd\b|solid\s*state/i.test(t)) out.kind = "SSD";
  else if (/\bhdd\b|rpm|5400|7200|hard\s*(disk|drive)|\bST\d{3,5}[A-Z]{2}\d{3}/i.test(t)) out.kind = "HDD";
  return out;
}

async function labelScan(file) {
  const status = m => { const s = $("#scanStatus"); if (s) s.textContent = m; };
  try {
    status("Photo taiyar ho rahi hai…");
    const bmp = await toBitmap(file);
    if (editPhotos.length < MAX_PHOTOS) { editPhotos.push(await compressBitmap(bmp)); renderThumbs(); }
    status("Barcode dhoondh raha hoon…");
    const codes = await detectBarcodes(bmp);
    status("OCR chal raha hai (pehli baar 1-2 minute lag sakte hain, internet chahiye)…");
    let text = "", ocrFailed = false;
    try { text = await runOCR(bmp, p => status("OCR " + p + "%")); } catch { ocrFailed = true; }
    const info = parseLabel(text), found = [];
    const setIf = (id, val, label) => { const el = $("#" + id); if (el && val && !el.value.trim()) { el.value = val; found.push(label + ": " + val); } };
    const serialCode = codes.find(c => /^[A-Za-z0-9\-]{6,25}$/.test(c) && /\d/.test(c) && !/^\d{12,14}$/.test(c));
    setIf("f_serial", (serialCode || info.serial || "").toUpperCase(), "Serial");
    setIf("f_model", info.model, "Model"); setIf("f_capacity", info.capacity, "Capacity");
    setIf("f_health", info.health, "Health"); setIf("f_hours", info.hours, "Hours");
    if (info.kind && $("#f_kind")) { $("#f_kind").value = info.kind; found.push("Type: " + info.kind); }

    if (prod && $("#f_notes") && !$("#f_notes").value.trim()) { $("#f_notes").value = "Barcode: " + prod; found.push("Barcode"); }
    status(found.length ? "Mila → " + found.join(", ") + ". Kripya sab check kar lo." : (ocrFailed ? "OCR load nahi hua (internet check karo)." : "Kuch pakka nahi mila. Photo saaf aur seedhi lo, ya haath se bharo."));
  } catch (e) { status("Scan error: " + e.message); }
}

function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(syncPublic, 2000); }
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const photoKey = arr => arr.length + ":" + arr.map(p => p.length + p.slice(-24)).join("|");
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
async function thumbOf(src) {
  const img = await loadImg(src), s = Math.min(1, 480 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  let q = 0.6, out = c.toDataURL("image/jpeg", q);
  while (out.length > 60000 && q > 0.3) { q -= 0.08; out = c.toDataURL("image/jpeg", q); }
  return out;
}
const thumbCache = new Map();
async function thumbsFor(it, key) {
  const c = thumbCache.get(it.id); if (c && c.key === key) return c.th;
  const th = []; for (const p of it.photos.slice(0, 3)) { try { th.push(await thumbOf(p)); } catch {} }
  thumbCache.set(it.id, { key, th }); return th;
}
const publicItems = () => items.filter(i => i.status === "In Stock" && i.showPublic !== "0").sort((a, b) => a.kind.localeCompare(b.kind) || num(a.sellPrice) - num(b.sellPrice));
async function syncPublic() {
  if (!user || !driveServer || !publicServer) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  try {
    const want = publicItems(), ids = new Set(want.map(i => i.id)), ops = [];
    for (const it of want) {
      const key = photoKey(it.photos);
      const base = { id: it.id, kind: it.kind, brandModel: it.brandModel, capacity: it.capacity, condition: it.condition, warranty: it.warranty, sellPrice: num(it.sellPrice), createdAt: it.createdAt };
      const sig = hash(JSON.stringify(base) + key), cur = publicMap.get(it.id);
      if (cur && cur.sig === sig) continue;
      const photos = await thumbsFor(it, key);
      ops.push(b => b.set(doc(db, "public_stock", it.id), { ...base, photos, sig, updatedAt: Date.now() }));
    }
    for (const id of publicMap.keys()) if (!ids.has(id)) ops.push(b => b.delete(doc(db, "public_stock", id)));
    if (ops.length) await writeMany(ops);
    if (metaLoaded && shopLoaded && (publicMeta ? (publicMeta.name !== shop.name || publicMeta.phone !== shop.phone || publicMeta.address !== shop.address) : (shop.name || shop.phone))) {
      await setDoc(doc(db, "public_meta", "shop"), { name: shop.name || "", phone: shop.phone || "", address: shop.address || "", updatedAt: Date.now() });
    }
  } catch (e) { console.warn("public sync", e); }
  finally { syncing = false; if (syncAgain) { syncAgain = false; setTimeout(syncPublic, 800); } }
}
const publicLink = () => new URL("stock.html", location.href).href;
function listText() {
  const list = publicItems();
  let t = `*${shop.name || "Silicon Traders"} - Stock List*\n(${today()})\n\n`;
  list.forEach((i, n) => { t += `${n + 1}. ${i.kind} ${i.brandModel} ${i.capacity}`.replace(/\s+/g, " ") + ` - *${num(i.sellPrice) ? "₹" + m0(num(i.sellPrice)) : "Call for price"}*\n`; });
  t += `\n✅ ON SALE\nPhotos ke saath poori list: ${publicLink()}`;
  if (shop.phone) t += `\nCall / WhatsApp: ${shop.phone}`;
  return t;
}
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast("Copy ho gaya"), () => prompt("Copy karo:", t));
  else prompt("Copy karo:", t);
}
function openShare() {
  openModal(`<h3>Public Stock List</h3>
    <p class="sub">Ye link kholne par koi bhi (bina login) sirf ON SALE drives aur unke selling price dekh sakta hai. Serial, buying price, health jaisi cheezein bilkul nahi dikhti.</p>
    <label>Public link</label><input readonly value="${esc(publicLink())}" onclick="this.select()">
    <div class="sub">Abhi public list mein <b>${publicItems().length}</b> drives hain.</div>
    <div class="row">
      <button class="btn primary grow" data-act="wa">WhatsApp par link bhejo</button>
      <button class="btn grow" data-act="copylink">Link copy</button>
    </div>
    <div class="row">
      <button class="btn grow" data-act="walist">WhatsApp par poori list (text)</button>
      <button class="btn grow" data-act="copylist">List copy</button>
    </div>
    <div class="sub">WhatsApp group banakar uska link group mein bhej do; list apne aap update hoti rehti hai. Kisi drive ko chhupana ho to Edit mein "Public stock list mein dikhao" band karo.</div>
    <button class="btn grow" style="width:100%" data-act="closeModal">Band karo</button>`);
}

// ---------- actions ----------
const byId = id => items.find(x => x.id === id);
const actions = {
  tab: d => { tab = d.v; render(); },
  fab: () => tab === "stock" ? openEditor(null) : tab === "bills" ? openBill() : openCat(null),
  add: () => openEditor(null), edit: d => openEditor(d.id),
  sell: d => openBill({ driveId: d.id }),
  stock: d => revertDrive(d.id),
  del: d => { const it = byId(d.id); if (it && confirm("Delete karein?\n" + it.brandModel + " • " + it.serial)) deleteDoc(doc(db, "drives", d.id)).catch(e => toast("Delete error: " + (e.code || e.message))); },
  invoice: d => { const it = byId(d.id); if (!it) return; const b = billOfDrive(it.id); makePdf(b || billFromDrive(it)); },
  filter: d => { filter = d.v; render(); },
  scansearch: async () => { const v = await scanBarcode(); if (v) { query = v; $("#q").value = v; tab = "stock"; render(); } },
  scanserial: async () => { const v = await scanBarcode(); if (v && $("#f_serial")) $("#f_serial").value = v; },
  labelscan: () => $("#f_scan").click(), cam: () => $("#f_cam").click(), gal: () => $("#f_gal").click(),
  rmph: d => { editPhotos.splice(+d.i, 1); renderThumbs(); },
  saveEditor, closeModal, closeSub,
  billpdf: d => { const b = bills.find(x => x.id === d.id); if (b) makePdf(b); },
  billedit: d => openBill({ billId: d.id }), billdel: d => deleteBill(d.id),
  addDrive: openPicker, pickDone, scanadd: scanAdd,
  addEw: () => { const l = ewLine(); if (!l) { toast("Pehle E-waste tab mein category banao"); return; } draft.lines.push(l); renderLines(); },
  addCustom: () => { draft.lines.push({ t: "custom", driveId: "", catId: "", desc: "", spec: "", serial: "", unit: "pc", qty: 1, rate: 0 }); renderLines(); },
  rmline: d => { draft.lines.splice(+d.i, 1); renderLines(); },
  saveBill: () => saveBill(false), saveBillPdf: () => saveBill(true),
  catedit: d => openCat(d.id), catsave: saveCat, catdel: d => { if (confirm("Category delete karein?")) { deleteDoc(doc(db, "ewaste", d.id)); closeModal(); } },
  seedcats: seedCats, ewbill: () => openBill({ ewaste: true }),
  share: openShare, copylink: () => copyText(publicLink()), copylist: () => copyText(listText()),
  wa: () => window.open("https://wa.me/?text=" + encodeURIComponent((shop.name || "Silicon Traders") + " - ON SALE stock list (photo aur price ke saath):\n" + publicLink()), "_blank"),
  walist: async () => { const tx = listText(); if (navigator.share) { try { await navigator.share({ text: tx }); return; } catch (e) { if (e.name === "AbortError") return; } } window.open("https://wa.me/?text=" + encodeURIComponent(tx), "_blank"); },
  shop: openShop, saveShop, backup: doBackup, restore: () => $("#restoreFile").click(), doMerge, doReplace,
  logout: () => { if (confirm("Logout karein?")) signOut(auth); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && actions[el.dataset.act]) actions[el.dataset.act](el.dataset);
});
$("#restoreFile").addEventListener("change", onRestoreFile);

</script>
</body>
</html>
